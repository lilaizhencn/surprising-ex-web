<style>

            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

        /* Input focus outline override for design system compliance */
        input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>

<body class="min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed TopNavBar for Login context as per rules -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract background elements for professional tech feel -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[40%] h-[40%] bg-tertiary-container/5 rounded-full blur-3xl mix-blend-multiply"></div>
</div>
<div class="w-full max-w-md z-10">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Surprising EX</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Sign in to your account</p>
</div>
<!-- Login Card -->
<div class="bg-surface border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0_8px_24px_rgba(0,0,0,0.02)]">
<form action="#" class="space-y-lg" method="POST">
<!-- Email/Phone Input -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface mb-xs" for="identifier">Email or Phone</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-DEFAULT px-md py-sm h-12 focus:border-primary focus:border-2 transition-all duration-200" id="identifier" name="identifier" placeholder="Enter your email or phone" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-body-sm text-body-sm text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-DEFAULT px-md py-sm h-12 focus:border-primary focus:border-2 transition-all duration-200" id="password" name="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors flex items-center justify-center w-8 h-8 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-headline-md text-headline-md h-12 rounded-DEFAULT transition-colors flex items-center justify-center gap-sm active:scale-[0.99]" type="submit">
                            Log In
                            <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account?
                        <a class="text-primary hover:text-primary-fixed-variant font-bold transition-colors ml-xs" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Security Notice -->
<div class="mt-xl text-center flex items-center justify-center gap-sm text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-body-sm text-body-sm">Secured by end-to-end encryption.</span>
</div>
</div>
</main>
<!-- Footer for contextual grounding, though simplified for auth flow -->
<footer class="w-full py-lg px-lg bg-surface-container-lowest border-t border-outline-variant mt-auto text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 Surprising EX. All rights reserved.</p>
</footer>
<script>
        // Simple password visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
