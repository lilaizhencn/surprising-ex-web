<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Navbar Suppressed for Transactional Linear Flow (Registration) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 bg-secondary-container/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="w-full max-w-[480px] bg-surface border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] relative z-10">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Step 1 of 3: Account Information</p>
</div>
<!-- Progress Indicator -->
<div class="flex gap-xs mb-lg">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
<form class="space-y-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-body-md text-body-md" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface text-on-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-body-md text-body-md" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="mt-2">
<div class="flex gap-1 mb-1">
<div class="h-1 flex-1 bg-tertiary rounded-full opacity-30"></div>
<div class="h-1 flex-1 bg-outline-variant rounded-full"></div>
<div class="h-1 flex-1 bg-outline-variant rounded-full"></div>
<div class="h-1 flex-1 bg-outline-variant rounded-full"></div>
</div>
<p class="font-body-sm text-body-sm text-outline text-xs">Password must be at least 8 characters</p>
</div>
</div>
<!-- Referral Code (Optional) -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="referral">Referral Code <span class="text-outline font-normal">(Optional)</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">tag</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-data-mono text-data-mono uppercase placeholder:normal-case placeholder:font-body-md" id="referral" placeholder="Enter code" type="text"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 border-outline-variant rounded text-primary focus:ring-primary bg-surface" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-primary hover:underline font-semibold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.
                    </label>

<!-- Footer Suppressed for Transactional Flow -->
<script>
        // Simple password strength visualization (demo purposes)
        const pwdInput = document.getElementById('password');
        const meterBars = document.querySelectorAll('.mt-2 .flex.gap-1 > div');

        pwdInput.addEventListener('input', function(e) {
            const val = e.target.value;
            let strength = 0;

            if (val.length > 0) strength = 1; // Weak
            if (val.length >= 8) strength = 2; // Fair
            if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength = 3; // Good
            if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) strength = 4; // Strong

            meterBars.forEach((bar, index) => {
                bar.className = 'h-1 flex-1 rounded-full transition-all duration-300 ';
                if (index < strength) {
                    if (strength === 1) bar.classList.add('bg-tertiary');
                    else if (strength === 2) bar.classList.add('bg-outline');
                    else if (strength === 3) bar.classList.add('bg-primary');
                    else if (strength === 4) bar.classList.add('bg-secondary');
                } else {
                    bar.classList.add('bg-outline-variant');
                }
            });
        });
    </script>
