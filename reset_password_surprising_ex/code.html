<!DOCTYPE html>

<html lang="en"><head>

                      "inverse-on-surface": "#f2f0f3",
                      "secondary-container": "#75fcad",
                      "on-error": "#ffffff",
                      "outline-variant": "#c3c5d9",

                      "surface-bright": "#fbf9fb",

                      "tertiary": "#9e0d22",
                      "secondary-fixed-dim": "#56df93",
                      "secondary": "#006d3f",

                      "on-tertiary-fixed-variant": "#92001b",

              },
              "borderRadius": {

              "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopNavBar Suppressed for Transactional Intent -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Ambient Background Pattern -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-5">
<svg class="w-full h-full" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="relative z-10 w-full max-w-[480px]">
<!-- Brand Mark -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Surprising EX</h1>
</div>
<!-- Card Container -->
<div class="bg-surface border border-outline-variant rounded-xl p-lg md:p-xl shadow-sm">
<div class="mb-lg">
<button class="inline-flex items-center text-on-surface-variant hover:text-primary transition-colors mb-md group" onclick="window.history.back()">
<span class="material-symbols-outlined text-lg mr-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-body-sm text-body-sm">Back to login</span>
</button>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Reset your password</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email or phone number to receive a verification code.</p>
</div>
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-lg">
<button class="flex-1 pb-sm border-b-2 border-primary text-primary font-body-sm text-body-sm font-medium transition-colors" id="tab-email">Email</button>
<button class="flex-1 pb-sm border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-body-sm text-body-sm transition-colors" id="tab-phone">Phone Number</button>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<div class="block" id="email-field">
<label class="block font-body-sm text-body-sm text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary py-sm pl-xl pr-sm font-body-sm text-body-sm text-on-surface transition-all placeholder:text-outline" id="email" name="email" placeholder="Enter your registered email" type="email"/>
</div>
</div>
<div class="hidden" id="phone-field">
<label class="block font-body-sm text-body-sm text-on-surface mb-xs" for="phone">Phone Number</label>
<div class="flex rounded-DEFAULT shadow-sm">
<span class="inline-flex items-center px-sm rounded-l-DEFAULT border border-r-0 border-outline-variant bg-surface-container-low text-on-surface-variant font-body-sm text-body-sm">
                                +1
                            </span>
<input class="flex-1 block w-full rounded-none rounded-r-DEFAULT bg-surface-container-low border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary py-sm px-sm font-body-sm text-body-sm text-on-surface transition-all placeholder:text-outline" id="phone" name="phone" placeholder="Enter your phone number" type="tel"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-medium rounded py-sm px-md hover:bg-primary-container transition-colors active:opacity-80 flex justify-center items-center" type="submit">
<span>Send Verification Code</span>
<span class="material-symbols-outlined ml-xs text-sm">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-sm">lock</span>
                        Secured by Surprising EX Identity
                    </p>
</div>
</div>
</div>
</main>
<!-- Footer Suppressed for Transactional Intent -->
<script>
        // Simple tab switching logic
        const tabEmail = document.getElementById('tab-email');
        const tabPhone = document.getElementById('tab-phone');
        const fieldEmail = document.getElementById('email-field');
        const fieldPhone = document.getElementById('phone-field');

        tabEmail.addEventListener('click', () => {
            tabEmail.classList.add('border-primary', 'text-primary', 'font-medium');
            tabEmail.classList.remove('border-transparent', 'text-on-surface-variant');

            tabPhone.classList.remove('border-primary', 'text-primary', 'font-medium');
            tabPhone.classList.add('border-transparent', 'text-on-surface-variant');

            fieldEmail.classList.remove('hidden');
            fieldPhone.classList.add('hidden');
        });

        tabPhone.addEventListener('click', () => {
            tabPhone.classList.add('border-primary', 'text-primary', 'font-medium');
            tabPhone.classList.remove('border-transparent', 'text-on-surface-variant');

            tabEmail.classList.remove('border-primary', 'text-primary', 'font-medium');
            tabEmail.classList.add('border-transparent', 'text-on-surface-variant');

            fieldPhone.classList.remove('hidden');
            fieldEmail.classList.add('hidden');
        });
    </script>
</body></html>
