openapi: 3.1.0
info:
  title: Surprising EX API
  version: 0.1.0-audited
  description: Frontend integration contract assembled from the surprising-ex backend source audit.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder only; replace with the deployed API base URL.
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Market
  - name: Account
  - name: Trading
  - name: Security
  - name: Compliance
  - name: Notifications
  - name: Announcements
  - name: Help
paths:
  /legal/current:
    $ref: ./content.openapi.json#/paths/~1legal~1current
  /legal/documents/{slug}:
    $ref: ./content.openapi.json#/paths/~1legal~1documents~1{slug}
  /legal/revisions/{revisionId}:
    $ref: ./content.openapi.json#/paths/~1legal~1revisions~1{revisionId}
  /legal/status:
    $ref: ./content.openapi.json#/paths/~1legal~1status
  /legal/consents:
    $ref: ./content.openapi.json#/paths/~1legal~1consents
  /admin/legal/revisions:
    $ref: ./content.openapi.json#/paths/~1admin~1legal~1revisions
  /admin/legal/revisions/{revisionId}:
    $ref: ./content.openapi.json#/paths/~1admin~1legal~1revisions~1{revisionId}
  /admin/legal/revisions/{revisionId}/publish:
    $ref: ./content.openapi.json#/paths/~1admin~1legal~1revisions~1{revisionId}~1publish
  /admin/legal/revisions/{revisionId}/withdraw:
    $ref: ./content.openapi.json#/paths/~1admin~1legal~1revisions~1{revisionId}~1withdraw
  /admin/legal/revisions/{revisionId}/audit:
    $ref: ./content.openapi.json#/paths/~1admin~1legal~1revisions~1{revisionId}~1audit
  /admin/content/media:
    $ref: ./content.openapi.json#/paths/~1admin~1content~1media
  /content/media/{mediaId}:
    $ref: ./content.openapi.json#/paths/~1content~1media~1{mediaId}
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      x-status: confirmed-by-legacy-client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated session; exact response DTO requires backend confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh session
      x-status: confirmed-by-backend-audit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session revoked; repeated calls are idempotent.
  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      x-status: confirmed-by-legacy-client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Registered session or verification challenge.
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password recovery
      x-status: confirmed-by-legacy-client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '200':
          description: Recovery request accepted.
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      x-status: confirmed-by-legacy-client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset result.
  /gateway/instrument:
    get:
      tags: [Market]
      summary: List instruments
      x-status: confirmed-by-backend-audit
      parameters:
        - $ref: '#/components/parameters/ProductLine'
        - name: symbol
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Instrument list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /gateway/candlestick:
    get:
      tags: [Market]
      summary: Get candlesticks
      x-status: confirmed-by-backend-audit
      parameters:
        - $ref: '#/components/parameters/ProductLine'
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: interval
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candle list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /gateway/account/product-balances:
    get:
      tags: [Account]
      summary: Get product balances
      x-status: confirmed-by-backend-audit
      parameters:
        - $ref: '#/components/parameters/ProductLine'
      responses:
        '200':
          description: Balance list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /gateway/account/transfers:
    post:
      tags: [Account]
      summary: Create an internal transfer
      x-status: confirmed-by-backend-audit
      parameters:
        - $ref: '#/components/parameters/ProductLine'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Accepted transfer; final state requires query or private event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /gateway/trading/orders:
    post:
      tags: [Trading]
      summary: Submit an order
      x-status: confirmed-by-backend-audit
      parameters:
        - $ref: '#/components/parameters/ProductLine'
        - $ref: '#/components/parameters/ClientOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Accepted order; not necessarily filled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /security/scenes:
    get:
      tags: [Security]
      summary: List security scenes
      x-status: partial
      responses:
        '200':
          description: Security scene list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /security/mfa:
    get:
      tags: [Security]
      summary: Get MFA status
      x-status: confirmed-by-backend-audit
      responses:
        '200':
          description: MFA status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /security/mfa/enroll:
    post:
      tags: [Security]
      summary: Start MFA enrollment
      x-status: confirmed-by-backend-audit
      responses:
        '200':
          description: MFA enrollment challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /security/mfa/confirm:
    post:
      tags: [Security]
      summary: Confirm MFA enrollment
      x-status: confirmed-by-backend-audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: MFA confirmed.
  /security/mfa/disable:
    post:
      tags: [Security]
      summary: Disable MFA
      x-status: confirmed-by-backend-audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: MFA disabled.
  /compliance/kyc:
    get:
      tags: [Compliance]
      summary: Get KYC status
      x-status: confirmed-by-backend-audit
      responses:
        '200':
          description: Current user KYC profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags: [Compliance]
      summary: Submit KYC application
      x-status: confirmed-by-backend-audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycSubmissionRequest'
      responses:
        '200':
          description: Persisted KYC profile and short-lived third-party launch session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmissionResponse'
  /compliance/kyc/provider:
    get:
      tags: [Compliance]
      summary: Get active KYC provider and simulation mode
      responses:
        '200':
          description: Server-selected provider configuration safe for the signed-in user.
  /compliance/kyc/simulation/complete:
    post:
      tags: [Compliance]
      summary: Complete a development-only simulated KYC result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED, MANUAL_REVIEW] }
      responses:
        '200': { description: Updated KYC profile. }
        '403': { description: Simulation is disabled or the KYC session is not pending. }
  /compliance/kyc/session/refresh:
    post:
      tags: [Compliance]
      summary: Refresh the active Sumsub SDK access token
      responses:
        '200': { description: Refreshed short-lived provider launch session. }
        '403': { description: No pending Sumsub verification session. }
  /compliance/kyc/webhooks/{provider}:
    post:
      tags: [Compliance]
      summary: Receive a signed Sumsub or Veriff decision webhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [SUMSUB, VERIFF] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Verified callback accepted or already processed. }
        '401': { description: Invalid signature or callback does not match an active session. }
  /compliance/kyc/documents:
    post:
      tags: [Compliance]
      summary: Upload a KYC document
      x-status: confirmed-by-backend-audit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, file]
              properties:
                documentType: { type: string }
                file: { type: string, format: binary }
      responses:
        '200':
          description: Stored document metadata.
  /notifications:
    get:
      tags: [Notifications]
      summary: List user notifications
      x-status: confirmed-by-backend-audit
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Notifications for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /announcements:
    get:
      tags: [Announcements]
      summary: List currently visible public announcements
      description: Supports en-US, zh-CN, zh-TW, es-ES, fr-FR, de-DE, pt-BR, ru-RU, ar-SA, ja-JP, ko-KR and hi-IN. Missing announcement translations fall back to English, then Chinese; the response locale identifies the actual content language. Authenticated users receive readAt and unreadCount; anonymous clients may read the public feed.
      security:
        - bearerAuth: []
        - {}
      x-status: confirmed-by-backend-implementation
      parameters:
        - { name: locale, in: query, schema: { type: string, default: en-US } }
        - { name: productLine, in: query, schema: { type: string, default: ALL } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, IOS, ANDROID], default: WEB } }
        - { name: placement, in: query, schema: { type: string, enum: [CENTER, MODAL, BANNER], default: CENTER } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Announcement page and personalized unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementPage' }
  /announcements/{announcementId}:
    get:
      tags: [Announcements]
      summary: Get an active announcement
      security:
        - bearerAuth: []
        - {}
      x-status: confirmed-by-backend-implementation
      parameters:
        - { name: announcementId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: locale, in: query, schema: { type: string, default: en-US } }
        - { name: productLine, in: query, schema: { type: string, default: ALL } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, IOS, ANDROID], default: WEB } }
        - { name: placement, in: query, schema: { type: string, enum: [CENTER, MODAL, BANNER], default: CENTER } }
      responses:
        '200':
          description: Localized announcement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '404': { $ref: '#/components/responses/BusinessError' }
  /announcements/unread-count:
    get:
      tags: [Announcements]
      summary: Count unread visible announcements for the current user
      x-status: confirmed-by-backend-implementation
      parameters:
        - { name: productLine, in: query, schema: { type: string, default: ALL } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, IOS, ANDROID], default: WEB } }
        - { name: placement, in: query, schema: { type: string, enum: [CENTER, MODAL, BANNER], default: CENTER } }
      responses:
        '200':
          description: Unread announcement count.
          content:
            application/json:
              schema: { type: integer, format: int32 }
  /announcements/{announcementId}/read:
    post:
      tags: [Announcements]
      summary: Mark one announcement as read
      x-status: confirmed-by-backend-implementation
      parameters:
        - { name: announcementId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: locale, in: query, schema: { type: string, default: en-US } }
        - { name: productLine, in: query, schema: { type: string, default: ALL } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, IOS, ANDROID], default: WEB } }
        - { name: placement, in: query, schema: { type: string, enum: [CENTER, MODAL, BANNER], default: CENTER } }
      responses:
        '200':
          description: Updated announcement with readAt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
  /announcements/read-all:
    post:
      tags: [Announcements]
      summary: Mark all visible announcements as read
      x-status: confirmed-by-backend-implementation
      parameters:
        - { name: productLine, in: query, schema: { type: string, default: ALL } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, IOS, ANDROID], default: WEB } }
        - { name: placement, in: query, schema: { type: string, enum: [CENTER, MODAL, BANNER], default: CENTER } }
      responses:
        '200':
          description: Number of newly read announcements.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties: { updated: { type: integer, format: int64 } }
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      x-status: confirmed-by-backend-audit
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated notification.
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      x-status: confirmed-by-backend-audit
      responses:
        '200':
          description: Number of notifications updated.
          content:
            application/json:
              schema: { type: integer }
  /help/articles:
    get:
      tags: [Help]
      summary: Search public help articles
      security: []
      x-status: confirmed-by-backend-audit
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Matching help articles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HelpArticle' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductLine:
      name: X-Product-Line
      in: header
      schema:
        type: string
      description: Product line header used by gateway controllers.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    ClientOrderId:
      name: clientOrderId
      in: header
      schema:
        type: string
  schemas:
    AuthRequest:
      type: object
      additionalProperties: true
      required: [password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
        totpCode:
          type: string
          minLength: 6
          maxLength: 6
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    PasswordRecoveryRequest:
      type: object
      additionalProperties: true
      properties:
        email:
          type: string
        phone:
          type: string
    PasswordResetRequest:
      type: object
      additionalProperties: true
      required: [password]
      properties:
        resetToken:
          type: string
        password:
          type: string
          format: password
    AuthSession:
      type: object
      additionalProperties: true
    KycSubmissionRequest:
      type: object
      required: [applicantType, kycLevel, country, documentType]
      properties:
        applicantType: { type: string }
        kycLevel: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        documentType: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        submittedDocuments: { type: string }
        faceVerificationStatus: { type: string }
        documentIds:
          type: array
          items: { type: integer, format: int64 }
    KycSubmissionResponse:
      type: object
      required: [profile, verificationSession]
      properties:
        profile: { type: object, additionalProperties: true }
        verificationSession:
          type: object
          required: [provider, status, simulated]
          properties:
            provider: { type: string, enum: [SELF, SUMSUB, VERIFF] }
            providerReference: { type: string, nullable: true }
            launchToken: { type: string, nullable: true, description: Short-lived and only returned to the authenticated applicant. }
            redirectUrl: { type: string, format: uri, nullable: true }
            status: { type: string, enum: [PENDING] }
            simulated: { type: boolean }
    AnnouncementTranslation:
      type: object
      required: [locale, title, summary, body]
      properties:
        locale: { type: string }
        title: { type: string }
        summary: { type: string }
        body: { type: string }
        bodyHtml: { type: [string, 'null'], maxLength: 64000, description: Sanitized HTML with managed public CDN media. }
    Announcement:
      type: object
      required: [announcementId, category, status, effectiveStatus, priority, placements, productLines, platforms, startsAt, version, translations, createdAt, updatedAt]
      properties:
        announcementId: { type: integer, format: int64 }
        category: { type: string, enum: [GENERAL, PRODUCT, MAINTENANCE, SECURITY, RISK] }
        status: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
        effectiveStatus: { type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, EXPIRED, WITHDRAWN] }
        priority: { type: integer }
        placements: { type: array, items: { type: string, enum: [CENTER, MODAL, BANNER] } }
        productLines: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string, enum: [WEB, IOS, ANDROID] } }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        translations: { type: array, items: { $ref: '#/components/schemas/AnnouncementTranslation' } }
        locale: { type: string, nullable: true }
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        body: { type: string, nullable: true }
        bodyHtml: { type: [string, 'null'], maxLength: 64000 }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AnnouncementPage:
      type: object
      required: [announcements, unreadCount, offset, limit, hasMore]
      properties:
        announcements: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
        unreadCount: { type: integer, format: int64 }
        offset: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }
    Notification:
      type: object
      required: [notificationId, category, title, body, createdAt]
      properties:
        notificationId: { type: integer, format: int64 }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    HelpArticle:
      type: object
      required: [articleId, title, category, summary, body, updatedAt]
      properties:
        articleId: { type: string }
        title: { type: string }
        category: { type: string }
        summary: { type: string }
        body: { type: string }
        updatedAt: { type: string, format: date-time }
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        userId:
          type: string
    TransferRequest:
      type: object
      additionalProperties: true
      required: [fromProductLine, toProductLine, asset, amount]
      properties:
        fromProductLine:
          type: string
        toProductLine:
          type: string
        asset:
          type: string
        amount:
          type: integer
          description: Minimum-unit integer; exact scale is asset-specific.
    OrderRequest:
      type: object
      additionalProperties: true
      required: [symbol, side, type, quantity]
      properties:
        symbol:
          type: string
        side:
          type: string
        type:
          type: string
        quantity:
          type: number
        price:
          type: number
        clientOrderId:
          type: string
    Envelope:
      type: object
      additionalProperties: true
      description: Response envelope remains open until backend publishes a stable DTO.
    Error:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
  responses:
    Unauthorized:
      description: Access token invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BusinessError:
      description: Business validation or risk rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
