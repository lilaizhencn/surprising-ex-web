openapi: 3.1.0
info:
  title: Surprising EX API
  version: 0.1.0-audited
  description: Root entrypoint for the audited frontend contract. The detailed document is docs/api/openapi.yaml.
servers:
  - url: /api/v1
paths:
  /auth/login:
    $ref: ./api/openapi.yaml#/paths/~1auth~1login
  /security/sessions:
    get:
      summary: List the authenticated user's active sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cursor page of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionPage'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserSessionPage:
      type: object
      required: [count, sessions, hasMore, limit]
      properties:
        count: { type: integer }
        sessions: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        sort: { type: string }
        limit: { type: integer }
